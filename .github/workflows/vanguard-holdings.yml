name: Vanguard holdings — archive and verify

on:
  pull_request:
    branches: [main]
    paths:
      - "northstar/**"
      - "tests/**"
      - ".github/workflows/vanguard-holdings.yml"
  push:
    branches: [main]
    paths:
      - "northstar/**"
      - "tests/**"
      - ".github/workflows/vanguard-holdings.yml"
  workflow_dispatch:
  schedule:
    # Wednesday 04:00 UTC = 09:30 Asia/Kolkata; GitHub schedule is best effort.
    - cron: "0 4 * * 3"

permissions:
  contents: read

concurrency:
  group: northstar-vanguard-archive
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline unit and end-to-end tests
        run: python -m unittest discover -s tests -v

  live_probe:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose identifier coverage on the first Vanguard page
        shell: bash
        run: |
          python - <<'PY'
          import re
          from northstar.vanguard import FUNDS, URL, QUERY, request_graphql
          for fund, cfg in FUNDS.items():
              d = request_graphql(URL, {"operationName": "NorthstarHoldings", "query": QUERY, "variables": {"ids": [cfg["port_id"]], "cursor": None}})
              items = d["data"]["borHoldings"][0]["holdings"]["items"]
              equities = [h for h in items if str(h.get("securityType") or "").upper().startswith("EQ.")]
              missing = [h for h in equities if not re.fullmatch("[A-Z0-9]{7}", str(h.get("sedol1") or "").upper()) and not h.get("isin")]
              print(f"{fund}: page={len(items)} equities={len(equities)} no_valid_sedol_or_isin={len(missing)}")
              for h in missing[:10]:
                  print("  fields:", {k: h.get(k) for k in ("issuerName","securityType","isin","sedol1","ticker","marketValuePercentage")})
          PY
      - name: Verify full official holdings for both funds without publishing
        run: python -m northstar collect --root "$RUNNER_TEMP/northstar-probe"

  collect:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and compare; preserve error logs
        id: fetch
        shell: bash
        run: |
          set +e
          python -m northstar collect --root .
          result=$?
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit immutable snapshots, reports and diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf/snapshots reports/etf logs/runs
          if ! git diff --cached --quiet; then
            git commit -m "Archive dated official Vanguard holdings and run results"
            git push
          fi
      - name: Fail visibly when an API/source check fails
        if: steps.fetch.outputs.result != '0'
        run: |
          echo "::error::At least one Vanguard collection or comparison failed. Inspect logs/runs in the repository. No incomplete data was represented as a holding change."
          exit 1
