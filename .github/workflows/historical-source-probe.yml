name: Historical Q3 2026 source discovery (read only)

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/historical_source_probe.py"
      - "tools/august_september_diff.py"
      - ".github/workflows/historical-source-probe.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m tools.august_september_diff
